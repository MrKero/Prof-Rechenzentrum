<style>
/* Layout: Rechenheft – links Editor + Tastenfeld, rechts Ergebnis/Rechenweg/Graph; am Handy Tastenfeld unten angedockt */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #edf1f7; --ink: #16203a; --muted: #5b677e; --line: #d9e0ea;
  --grid: rgba(29, 91, 181, .075); --accent: #1d5bb5; --accent-ink: #ffffff; --accent-soft: rgba(29, 91, 181, .1);
  --mark: rgba(255, 214, 64, .62); --danger: #b93a26; --ok: #1d7f52; --gold: #e2a817;
  --g1: #1d5bb5; --g2: #d6501c; --g3: #23854a; --g4: #8a3fb0;
  --key: #ffffff; --key-op: #e6ecf4; --key-fn: #dde6f3; --key-tool: #e9edf3; --shadow: 0 1px 0 rgba(22, 32, 58, .06), 0 6px 18px -10px rgba(22, 32, 58, .25);
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", "Noto Sans JP", "Noto Sans KR", "PingFang SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --glass: rgba(246, 248, 252, .72); --glass-line: rgba(255, 255, 255, .7); --glass-shadow: 0 12px 34px -12px rgba(22, 32, 58, .35);
  --mark-soft: rgba(255, 214, 64, .26); --f-brand: "Fraunces", "Iowan Old Style", Georgia, serif;
  --r: 14px; --kp-h: 0px; --key-h: 46px; --hdr: 58px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1217; --surface: #151a21; --surface-2: #1b222b; --ink: #e6ebf2; --muted: #95a1b5; --line: #262f3a;
  --grid: rgba(122, 167, 255, .06); --accent: #7fa9ff; --accent-ink: #0a1120; --accent-soft: rgba(127, 169, 255, .14);
  --mark: rgba(226, 190, 70, .30); --mark-soft: rgba(226, 190, 70, .13); --glass: rgba(26, 32, 41, .66); --glass-line: rgba(255, 255, 255, .09); --glass-shadow: 0 14px 36px -12px rgba(0, 0, 0, .7); --danger: #ff8a73; --ok: #63d394; --gold: #f2c14e;
  --g1: #7fa9ff; --g2: #ff9466; --g3: #66d48c; --g4: #cf9bf0;
  --key: #1b222b; --key-op: #222a35; --key-fn: #1d2938; --key-tool: #252e3a; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #151a21; --surface-2: #1b222b; --ink: #e6ebf2; --muted: #95a1b5; --line: #262f3a;
  --grid: rgba(122, 167, 255, .06); --accent: #7fa9ff; --accent-ink: #0a1120; --accent-soft: rgba(127, 169, 255, .14);
  --mark: rgba(226, 190, 70, .30); --mark-soft: rgba(226, 190, 70, .13); --glass: rgba(26, 32, 41, .66); --glass-line: rgba(255, 255, 255, .09); --glass-shadow: 0 14px 36px -12px rgba(0, 0, 0, .7); --danger: #ff8a73; --ok: #63d394; --gold: #f2c14e;
  --g1: #7fa9ff; --g2: #ff9466; --g3: #66d48c; --g4: #cf9bf0;
  --key: #1b222b; --key-op: #222a35; --key-fn: #1d2938; --key-tool: #252e3a; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; overscroll-behavior: none; }
.scroller { scroll-padding-top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 10px); scroll-padding-bottom: calc(var(--kp-h) + 20px); position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
body { font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(var(--hdr) + 10px) calc(var(--kp-h) + 28px); }
.card { scroll-margin-top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 12px); }

/* Kopf */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 35; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); display: flex; align-items: center; gap: 8px; height: calc(var(--hdr) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 1240px) / 2 + 16px)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 1240px) / 2 + 16px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-inline-end: auto; }
.logo-btn { width: 40px; height: 40px; padding: 0; border: 0; background: none; flex: none; border-radius: 11px; touch-action: manipulation; }
.logo-btn svg { width: 40px; height: 40px; display: block; filter: drop-shadow(0 3px 6px rgba(22, 32, 58, .18)); transition: transform .15s; }
.logo-btn:active svg { transform: scale(.92) rotate(-4deg); }
.wordmark { display: flex; flex-direction: column; min-width: 0; line-height: 1; }
.wordmark small { font: 600 10px/1 var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.wordmark b { font: 700 23px/1 var(--f-brand); font-style: normal; white-space: nowrap; letter-spacing: -.02em; font-variation-settings: "opsz" 48; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chip-angle { height: 40px; padding: 0 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 500 12.5px var(--f-mono); letter-spacing: .06em; white-space: nowrap; flex: none; }
.chip-angle b { color: var(--accent); font-weight: 500; }
.chip-angle i { font-style: normal; color: var(--muted); }
@media (max-width: 560px) { .logo-btn.l3d { --k: .9; } .chip-angle i { display: none; } .wordmark b { font-size: 21px; } .top { gap: 6px; } .iconbtn, .chip-angle { height: 38px; } .iconbtn { width: 38px; } .logo-btn, .logo-btn svg { width: 36px; height: 36px; } }
@media (max-width: 430px) { .wordmark b { font-size: 18px; } .wordmark small { font-size: 9px; } }
@media (max-width: 370px) { .wordmark b { font-size: 15.5px; } }

/* Raster */
.layout { display: grid; gap: 16px; grid-template-columns: 1fr; margin-top: 4px; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(400px, 470px) minmax(0, 1fr); align-items: start; } .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); } }
.left, .right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }

/* Editor (Karopapier) */
.display { position: relative; padding: 14px 14px 12px; background-color: var(--surface); cursor: text;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 14px 14px; background-position: -1px -1px; box-shadow: var(--shadow); }
.mq-wrap { padding-right: 34px; overflow-x: auto; overflow-y: hidden; min-height: 64px; display: flex; align-items: center; direction: ltr; scrollbar-width: thin; }
#mq { font-size: 25px; border: 0 !important; box-shadow: none !important; min-width: 100%; padding: 6px 2px; color: var(--ink); }
#mq.mq-editable-field.mq-focused { box-shadow: none; border: 0; }
.mq-math-mode, .mq-math-mode .mq-text-mode { font-family: var(--f-math) !important; }
.mq-math-mode .mq-text-mode { font-style: normal; }
.mq-editable-field .mq-cursor { border-left: 2px solid var(--accent) !important; margin-left: -1px; margin-right: -1px; }
.mq-editable-field .mq-selection, .mq-editable-field .mq-selection .mq-non-leaf, .mq-editable-field .mq-selection .mq-scaled { background: var(--accent-soft) !important; color: var(--ink) !important; }
.mq-math-mode .mq-empty { background: var(--accent-soft) !important; border-radius: 2px; }
.mq-math-mode .mq-root-block.mq-empty { background: transparent !important; }
.mq-math-mode .mq-large-operator .mq-empty:not(.mq-hasCursor) { opacity: .55; }
.mq-math-mode .mq-paren.mq-ghost { color: var(--muted); }
.mq-math-mode .mq-operator-name { font-family: var(--f-math); }
.mq-math-mode .mq-fraction .mq-denominator { border-top-color: currentColor; }
.mq-placeholder { position: absolute; left: 16px; top: 50%; transform: translateY(-80%); color: var(--muted); opacity: .75; font-size: 15px; pointer-events: none; }
.ed-foot { display: flex; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; min-height: 22px; font: 400 12px var(--f-mono); color: var(--muted); }
.ed-foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; min-width: 0; flex: 1; }

/* Aktionen */
.actions { display: flex; gap: 8px; }
.btn { height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; justify-content: center; font-weight: 600; }
.btn.ghost[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Tastenfeld */
.keypad { padding: 10px; box-shadow: var(--shadow); touch-action: none; overscroll-behavior: contain; }
.kp-tools { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; direction: ltr; }
.kp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; scroll-behavior: smooth; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 32px; padding: 0 11px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.kp-btn { flex: none; width: 36px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.kp-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.kp-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.keys.editing .key { animation: jiggle .25s ease-in-out infinite; transform-origin: 50% 50%; }
.keys.editing .key:nth-child(2n) { animation-duration: .27s; animation-delay: -.12s; animation-direction: reverse; }
.keys.editing .key:nth-child(3n) { animation-duration: .23s; animation-delay: -.07s; }
.keys.editing .key:nth-child(5n+1) { animation-delay: -.19s; }
.keys.editing .key.pick { border: 2px solid var(--accent); animation: none; transform: scale(1.04); box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .35); }
.keys.editing .key.target { background: var(--accent-soft); border: 2px solid var(--accent); animation: none; }
@keyframes jiggle { 0% { transform: rotate(-1.8deg) translate(0, .5px); } 25% { transform: rotate(.4deg) translate(.5px, 0); } 50% { transform: rotate(1.8deg) translate(0, -.5px); } 75% { transform: rotate(-.4deg) translate(-.5px, 0); } 100% { transform: rotate(-1.8deg) translate(0, .5px); } }
@media (prefers-reduced-motion: reduce) { .keys.editing .key { animation: none; } }
.kfrac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font: italic 400 14px/1 var(--f-math); }
.kfrac i:first-child { border-bottom: 1.4px solid currentColor; padding: 0 4px 2px; }
.kfrac i:last-child { padding-top: 2px; }
.paste-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.paste-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.paste-box { display: flex; gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.paste-box input { flex: 1; min-width: 0; height: 38px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface); padding: 0 10px; font-family: var(--f-mono); }
.paste-box .btn { height: 38px; flex: none; padding: 0 12px; }
.paste-box .iconbtn { width: 38px; height: 38px; }
.gl { display: grid; gap: 2px; margin-top: 8px; }
.gl-h { font: 500 11px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.gl-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.gl-sym { min-height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; padding: 4px; overflow: hidden; font: 500 15px var(--f-math); color: var(--accent); direction: ltr; }
.gl-sym svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gl-sym mjx-container { margin: 0 !important; max-width: 100%; }
.gl-txt { display: grid; gap: 3px; font-size: 13.5px; min-width: 0; }
.gl-txt b { font-weight: 600; font-size: 14px; }
.gl-txt span { color: var(--muted); }
.gl-ex { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 3px 8px; margin-top: 4px; direction: ltr; max-width: 100%; overflow: hidden; }
.gl-ex mjx-container { margin: 0 !important; }
.sheet .body .seg { margin: 8px 0 10px; }
.kp-toggle { flex: none; width: 36px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: none; }
.keys-view { overflow: hidden; position: relative; }
.keys { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 6px; direction: ltr; height: calc(var(--key-h) * 5 + 24px); touch-action: none; }
.keys.abc { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.keys.slide { transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .22s; }
.key { position: relative; min-height: 0; border-radius: 11px; border: 1px solid var(--line); background: var(--key); font: 500 17px/1 var(--f-ui); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 2px; touch-action: none; transition: transform .06s, background .1s; }
.key.sm { font-size: 13.5px; }
.key.addkey { background: transparent; border-style: dashed; color: var(--muted); opacity: .55; font-size: 22px; font-weight: 300; }
.key .lbl.tex { font-size: 12px; max-width: 100%; overflow: hidden; color: var(--ink); }
.key .lbl.tex mjx-container { margin: 0 !important; }
.key.lang { font-size: 14px; }
.pop button.del { color: var(--danger); }
.pop button.del.hi { background: var(--danger); color: #fff; }
.key-preview { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); overflow-x: auto; direction: ltr; }
input.txt { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; width: 100%; }
.ex.cat button { font-size: 14px; min-height: 36px; }
.key.down { transform: scale(.95); background: var(--accent-soft); }
.key.op { background: var(--key-op); }
.key.fn { background: var(--key-fn); color: var(--accent); font-size: 15px; }
.key.tool { background: var(--key-tool); height: 40px; font-size: 15px; }
.key.tool.on, .key.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.key.tool svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.key.wide { grid-column: span 2; }
.key.w3 { grid-column: span 3; }
.key small { font: 400 9.5px/1 var(--f-mono); color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.key .lbl { white-space: nowrap; font-family: inherit; }
.key .lbl.m { font-family: var(--f-math); font-size: 19px; font-weight: 400; }
.key.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 20px; }
.key.more::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; }
.keys.abc .key { font-size: 17px; border-radius: 9px; }
.keys.abc .key.fn { font-size: 14px; }
.keys .empty-note { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; font-size: 14px; }
/* Gedrückt-halten-Menü */
.pop { position: fixed; z-index: 70; display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 14px 34px -10px rgba(10, 16, 30, .45); direction: ltr; }
.pop button { min-width: 50px; height: 50px; padding: 0 10px; border-radius: 10px; border: 0; background: transparent; font: 400 20px/1 var(--f-math); color: var(--ink); pointer-events: none; white-space: nowrap; }
.pop button.hi { background: var(--accent); color: var(--accent-ink); }
.pop.grid { display: grid; }
.pop.grid button { font-size: 18px; min-width: 62px; }
.kops4 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 7px; font: 400 17px/1.05 var(--f-math); }
.kops4 i { font-style: normal; text-align: center; }
.speed-row { display: flex; align-items: center; gap: 12px; }
.speed-row input { flex: 1; min-width: 0; accent-color: var(--accent); }
.speed-row output { min-width: 92px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
@media (max-width: 979px) {
  .keypad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; border-radius: 22px 22px 0 0; border: 1px solid var(--glass-line); border-bottom: 0;
    background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -12px 34px -18px rgba(0, 0, 0, .4); transition: border-radius .2s, left .2s, right .2s, bottom .2s; }
  .kp-toggle { display: grid; place-items: center; }
  .keypad .key { box-shadow: 0 1px 0 rgba(0, 0, 0, .06); }
  .keypad.min .keys-view, .keypad.min .kp-tools, .keypad.min #editBtn, .keypad.min #resetOrder { display: none !important; }
  .keypad.min { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    border-radius: 999px; border-bottom: 1px solid var(--glass-line); padding: 6px 6px 6px 8px; box-shadow: var(--glass-shadow); }
  .keypad.min .kp-head { margin-bottom: 0; }
  .keypad.min .tab { height: 34px; border-radius: 999px; }
  .keypad.min .kp-btn, .keypad.min .kp-toggle { border-radius: 999px; height: 34px; width: 38px; background: transparent; border-color: transparent; }
  .keypad .kp-btn, .keypad .kp-toggle { background: color-mix(in srgb, var(--surface) 70%, transparent); }
  :root { --key-h: 44px; }
  .kp-tools { gap: 5px; margin-bottom: 6px; } .keys { gap: 5px; height: calc(var(--key-h) * 5 + 20px); }
  .key.tool { height: 38px; }
  .kp-head { margin-bottom: 6px; }
}
@media (max-height: 700px) and (max-width: 979px) { :root { --key-h: 39px; } .key.tool { height: 34px; } }

/* Ergebnis */
.result { padding: 16px 18px 14px; }
.res-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.label { font: 500 11px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.badge { font: 500 11px/1 var(--f-ui); padding: 4px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.in-tex { color: var(--muted); overflow-x: auto; overflow-y: hidden; direction: ltr; }
.out-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; direction: ltr; }
.out-row .eq { font: italic 400 34px/1 var(--f-display); color: var(--accent); flex: none; }
.out-tex { overflow-x: auto; overflow-y: hidden; min-width: 0; font-size: 125%; padding: 4px 0; }
mjx-container[display="true"] { text-align: left !important; margin: .2em 0 !important; }
.out-tex mjx-container[display="true"] { margin: 0 !important; }
.hl { display: inline-block; }

.recent { display: flex; flex-direction: column; gap: 8px; }
.recent-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 500; font-size: 13.5px; padding: 4px; }
.rcard { display: block; width: 100%; text-align: start; padding: 10px 16px; cursor: pointer; }
.rcard .q, .rcard .a { overflow-x: auto; overflow-y: hidden; direction: ltr; text-align: left; }
.rcard .q { color: var(--muted); font-size: 90%; }
.rcard mjx-container { margin: 0 !important; }
.rcard:active { background: var(--surface-2); }
.approx { margin-top: 4px; color: var(--muted); overflow-x: auto; direction: ltr; }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); }
.res-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.res-actions .btn { height: 36px; padding: 0 12px; font-size: 13.5px; }
.err { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.err .msg { color: var(--danger); font-weight: 500; }
.err .hint { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.steps { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.steps li > * { grid-column: 2; }
.steps li::before { content: counter(st); grid-column: 1; grid-row: 1 / span 8; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 500 12px/24px var(--f-mono); text-align: center; }
.st-title { font-weight: 500; font-size: 14px; }
.st-tex, .st-detail { overflow-x: auto; overflow-y: hidden; direction: ltr; min-width: 0; }
.st-methods { margin: 6px 0 4px; max-width: 420px; }
.st-methods button { flex: 1; font-size: 13px; white-space: nowrap; }
.st-sub { margin-top: 8px; }
.st-sub ol { list-style: none; margin: 0; padding: 0 0 0 10px; border-left: 2px solid var(--accent-soft); display: grid; gap: 8px; }
.st-sub ol:empty { display: none; }
.st-sub li { display: block; padding: 0; border: 0; counter-increment: none; }
.st-sub li::before { display: none; }
.st-sub .st-title { font-size: 13px; color: var(--muted); }
.sub-row { display: flex; flex-direction: column; gap: 0; margin-top: 4px; min-width: 0; }
.sub-k { font-size: 12px; color: var(--muted); }
.st-subbar { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.st-detail { margin-top: 4px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 92%; }
.analysis { padding: 16px 18px; }
.analysis h2, .graphcard h2 { font: italic 400 24px/1.1 var(--f-display); margin: 0 0 8px; }
.an-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.an-head h2 { margin: 0; }
.an-hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 6px; }
.an-fn { border-top: 2px solid var(--line); margin-top: 10px; padding-top: 6px; }
.an-fhead { display: flex; align-items: center; gap: 8px; }
.an-fhead i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chips .none { color: var(--muted); font-size: 13px; }
.pt-chip { --c: var(--accent); border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 3px 8px; min-height: 34px; direction: ltr; max-width: 100%; overflow: hidden; cursor: pointer; }
.pt-chip mjx-container { margin: 0 !important; }
.pt-chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: inset 3px 0 0 var(--c); }
.g-tools { margin-top: 10px; }
.mx-emb { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 2px; padding: 1px 7px; position: relative; cursor: pointer; }
.mx-emb::before, .mx-emb::after { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; border: 1.6px solid currentColor; }
.mx-emb::before { left: 0; border-right: 0; border-radius: 6px 0 0 6px; }
.mx-emb::after { right: 0; border-left: 0; border-radius: 0 6px 6px 0; }
.mx-g { display: inline-grid; gap: 1px 12px; align-items: center; justify-items: center; font-size: .82em; padding: 2px 1px; }
.mx-c { line-height: 1.15; }
.mx-ed { display: grid; gap: 12px; }
.mx-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.mx-head b { font-weight: 600; margin-right: auto; }
.mx-step { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.mx-step .iconbtn { width: 32px; height: 32px; font-size: 18px; }
.mx-k { color: var(--muted); font-size: 14px; }
.mx-body { overflow-x: auto; padding: 4px 14px; position: relative; }
.mx-grid { display: inline-grid; gap: 8px; padding: 6px 12px; position: relative; min-width: 0; }
.mx-grid::before, .mx-grid::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9px; border: 2px solid var(--ink); }
.mx-grid::before { left: 0; border-right: 0; border-radius: 10px 0 0 10px; }
.mx-grid::after { right: 0; border-left: 0; border-radius: 0 10px 10px 0; }
.mx-grid .mini { min-height: 40px; min-width: 54px; font-size: 18px; justify-content: center; text-align: center; }
.mx-foot { display: flex; justify-content: flex-end; gap: 8px; }
.mx-foot .btn { min-width: 64px; height: 40px; }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg.scroll button { flex: none; white-space: nowrap; }
.fs-search { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 0 12px; font: inherit; margin-bottom: 10px; }
.fs-list { display: grid; gap: 8px; }
.fs-g { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.fs-g summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.fs-g summary::after { content: '▾'; color: var(--muted); transition: transform .2s; }
.fs-g[open] summary::after { transform: rotate(180deg); }
.fs-items { display: grid; border-top: 1px solid var(--line); }
.fs-item { padding: 9px 14px; display: grid; gap: 3px; border-top: 1px solid var(--line); min-width: 0; }
.fs-item:first-child { border-top: 0; }
.fs-l { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.fs-t { overflow-x: auto; text-align: left; }
.fs-t mjx-container, .uc-row mjx-container { margin: 0 !important; text-align: left !important; }
.uc-cv { display: block; margin: 4px auto 0; touch-action: none; cursor: grab; max-width: 100%; }
.uc-wave { display: block; margin: 0 auto 6px; max-width: 100%; }
.uc-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.uc-ctl input { flex: 1; min-width: 140px; accent-color: var(--accent); }
.uc-ctl .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.uc-quick { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
.uc-quick button { flex: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-variant-numeric: tabular-nums; }
.uc-read { display: grid; gap: 6px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); margin: 4px 0 10px; font-size: 17px; }
.uc-expl { padding: 4px 0; }
.it-wrap { overflow-x: auto; margin-top: 4px; }
.it-tab { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-width: 300px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.it-hd { display: contents; }
.it-hd span { position: sticky; top: 0; z-index: 1; padding: 10px 12px; background: var(--surface-2); font-weight: 600; font-size: 13px; color: var(--ink); text-align: left; border-bottom: 1px solid var(--line); }
.it-hd span + span { border-left: 1px solid var(--line); }
.it-grp { grid-column: 1 / -1; padding: 12px 12px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-align: left; }
.it-r { display: contents; cursor: pointer; }
.it-r > span { padding: 8px 12px; text-align: left; display: flex; align-items: center; justify-content: flex-start; min-width: 0; overflow-x: auto; border-top: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.it-r > span + span { border-left: 1px solid var(--line); }
.it-r:hover > span, .it-r:focus-visible > span { background: var(--accent-soft); }
.it-r mjx-container { margin: 0 !important; text-align: left !important; }

.it-list { display: grid; gap: 6px; }
.it-row { text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; color: var(--ink); }
.g-table { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tb-ctl { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface-2); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.tb-ctl .iconbtn { width: 30px; height: 30px; font-size: 17px; }
.tb-k { color: var(--muted); font-size: 13px; margin-left: 6px; }
.tb-k b, .tb-ctl > b { color: var(--ink); font-weight: 600; }
.tb-row { display: grid; padding: 6px 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 14px; gap: 8px; }
.tb-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-h { font-weight: 600; background: var(--surface-2); }
.tb-x { color: var(--muted); }
.sf-cv { width: 100%; display: block; touch-action: none; cursor: grab; border-radius: 12px; background: var(--surface-2); margin-top: 8px; }
.sf-formula { margin-top: 4px; overflow-x: auto; }
.sf-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  if (S.dec === ',') s = s.replace(/,/g, '§').replace(/;/g, ',').replace(/§/g, '.');
  return s;
};

      const g = el('div', 'ex-group'); g.appendChild(el('h3', null, T(tab)));
      const wrap = el('div', 'ex');
      list.forEach(ex => { const b = el('button'); b.type = 'button'; render(b, K.decFix(ED.textToLatex(ex)), false); b.onclick = () => { closeSheet(); compute(ex); }; wrap.appendChild(b); });
      g.appendChild(wrap); body.appendChild(g);
    }
  });
}

/* ---------- Logo, Icon, Easter Egg ---------- */
function applyLogo() {
  logo3D(); logoIdle();
  try {
    const svg = LOGOS[S.logo].svg('ico').replace('<svg ', '<svg width="180" height="180" ');
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 180, 180);
      const url = c.toDataURL('image/png');
      $('#favicon').href = url; $('#touchicon').href = url;
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch (e) { }
}
let taps = [];
function logoSpin() {
  if (S.logoAnim === false) return;
  const b = $('#logoBtn');
  if (b.classList.contains('l3d')) { b.classList.remove('anim'); void b.offsetWidth; b.classList.add('anim'); b.querySelectorAll('.l-obj').forEach(o => { o.style.animationDelay = '0s'; }); return; }
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  setTimeout(() => b.classList.remove('spin'), 900);
}
function logoWink() {
  const b = $('#logoBtn'); if (S.logoAnim === false || !b.classList.contains('l3d')) return;
  b.classList.remove('wink'); void b.offsetWidth; b.classList.add('wink');
  setTimeout(() => b.classList.remove('wink'), 900);
}
function logoIdle() { $('#logoBtn').classList.toggle('anim', S.logoAnim !== false); }
function logo3D() { // Ebenen-Aufbau für die 3D-Drehung (nur Prof-Brille)
  const L = LOGOS[S.logo].layers, btn = $('#logoBtn');
  btn.classList.toggle('l3d', !!L);
  if (!L) { btn.innerHTML = LOGOS[S.logo].svg('hdr'); return; }
  const N = 9, sv = (inner, st) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"${st ? ` style="${st}"` : ''}>${inner}</svg>`;
  const solid = (inner, front, eye) => { let o = ''; for (let i = 0; i < N; i++) { const cap = i === 0 || i === N - 1, b = cap ? 1 : (0.55 + 0.1 * Math.sin(i / (N - 1) * Math.PI)).toFixed(2); o += sv((cap && front ? inner + front : inner) + (eye ? `<g class="l-reye">${eye.c}${cap ? eye.s : ''}</g>` : ''), `--i:${i};--b:${b}`); } return o; };
  // Dauer je Drehung antiproportional zur Größe (3 s bei 220 px), danach 3 s Pause
  const setKF = () => {
    const size = btn.getBoundingClientRect().width || 40, mob = matchMedia('(max-width: 560px)').matches, d = (mob ? 12 * 36 / size : 3 * 220 / size) / (S.logoSpeed || 1), T = 2 * d + 2, p1 = (d / T * 100).toFixed(3), p2 = (2 * d / T * 100).toFixed(3);
    let st = document.getElementById('lgKF'); if (!st) { st = document.createElement('style'); st.id = 'lgKF'; document.head.appendChild(st); }
    const e = 'animation-timing-function: cubic-bezier(.65, 0, .35, 1);';
    st.textContent = `@keyframes lgFace { 0% { transform: rotateY(0deg); ${e} } ${p1}%, 100% { transform: rotateY(360deg); } } @keyframes lgGlass { 0%, ${p1}% { transform: rotateY(0deg); ${e} } ${p2}%, 100% { transform: rotateY(-360deg); } }`;
    btn.style.setProperty('--lgT', T.toFixed(3) + 's'); btn.dataset.rot = d.toFixed(3);
  };
  // Zwinkern: nach jeweils 10 normalen Durchgängen zwinkert das =-Auge in der Pause
  logo3D.cycle = 0;
  if (!logo3D.wired) {
    logo3D.wired = true;
    const onCycle = e => {
      if (!e.target.classList || !e.target.classList.contains('l-glass')) return;
      logo3D.cycle++;
      if (logo3D.cycle % 5 === 0) { const d = parseFloat(btn.dataset.rot) || 1; clearTimeout(logo3D.wt); logo3D.wt = setTimeout(logoWink, (2 * d + 0.4) * 1000); }
    };
    btn.addEventListener('animationstart', e => { if (e.animationName === 'lgGlass') { logo3D.cycle = 0; onCycle(e); } });
    btn.addEventListener('animationiteration', e => { if (e.animationName === 'lgGlass') onCycle(e); });
  }
  setKF(); if (!logo3D.mq) { logo3D.mq = matchMedia('(max-width: 560px)'); logo3D.mq.addEventListener('change', () => logo3D.kf && logo3D.kf()); } logo3D.kf = setKF;
  btn.innerHTML = sv(L.bg).replace('<svg ', '<svg class="l-bg" ') + `<span class="l-scene"><span class="l-obj l-face">${solid(L.face)}</span><span class="l-obj l-glass">${solid(L.glass, L.signs, { c: L.reye, s: L.eq })}</span></span>`;
}
$('#logoBtn').addEventListener('click', () => {
  logoSpin();
  const now = Date.now(); taps = taps.filter(t => now - t < 3000); taps.push(now);
  if (taps.length >= 7) { taps = []; mathRain(); }
});
function mathRain() {
  const cv = $('#rain'); cv.hidden = false;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const SYM = ['∑', '∫', 'π', '√', '∞', '∂', 'Δ', 'θ', 'λ', 'e', 'i', '≈', '≠', '±', '÷', '×', '∇', 'φ', 'σ', 'μ', 'x²', 'n!', '∏', '≤', '≥', 'dx', 'lim', 'α', 'β', 'ω', '%', '½', '∈', 'ℝ', '∮'];
  const cols = ['--g1', '--g2', '--g3', '--g4', '--gold', '--accent'].map(cssVar);
  const slow = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = slow ? 30 : Math.min(140, Math.round(W / 6));
  const P2 = Array.from({ length: N }, () => ({
    s: SYM[Math.floor(Math.random() * SYM.length)], x: Math.random() * W, y: -40 - Math.random() * H * 0.9,
    v: (slow ? 60 : 160) + Math.random() * (slow ? 60 : 260), r: Math.random() * Math.PI, vr: (Math.random() - .5) * 3,
    size: 16 + Math.random() * 30, col: cols[Math.floor(Math.random() * cols.length)], sway: Math.random() * 2 * Math.PI
  }));
  let last = performance.now(), t0 = last;
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const age = (now - t0) / 1000;
    c.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of P2) {
      p.y += p.v * dt; p.r += p.vr * dt; p.sway += dt * 2;
      if (p.y < H + 60) alive++;
      c.save(); c.translate(p.x + Math.sin(p.sway) * 14, p.y); c.rotate(p.r);
      c.globalAlpha = Math.max(0, Math.min(1, 1.2 - Math.max(0, age - 4)));
      c.fillStyle = p.col; c.font = `500 ${p.size}px "STIX Two Text", "Times New Roman", serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(p.s, 0, 0); c.restore();
    }
    if (alive && age < 6) requestAnimationFrame(tick); else { c.clearRect(0, 0, W, H); cv.hidden = true; }
  };
  requestAnimationFrame(tick);
}

/* ---------- Updates ---------- */
const newer = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((pa[i] || 0) > (pb[i] || 0)) return true; if ((pa[i] || 0) < (pb[i] || 0)) return false; } return false; };
async function fetchVersion() {
  const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).version;
}
async function checkUpdate(manual, status, row) {
  if (status) { status.className = 'upd-status'; status.textContent = T('upd_checking'); }
  try {
    const v = await fetchVersion();
    if (newer(v, APP_VERSION)) {
      if (!manual) {
        if (ss.get('profrz.updTried') === v) return; // nicht in Schleife neu laden
        ss.set('profrz.updTried', v); location.reload(); return;
      }
      status.textContent = T('upd_found', { v });
      if (!row.querySelector('.primary')) row.appendChild(btn(T('upd_install'), null, () => location.reload(), 'btn primary'));
    } else if (status) { status.className = 'upd-status ok'; status.textContent = T('upd_latest') + ' (' + APP_VERSION + ')'; }
  } catch (e) { if (status) status.textContent = T('upd_fail'); }
}

$('#histBtn').onclick = showHistory;
$('#setBtn').onclick = showSettings;

$('#goBtn').onclick = () => compute();
$('#kpToggle').onclick = () => { const k = $('#keypad'); k.classList.toggle('min'); $('#kpToggle').textContent = k.classList.contains('min') ? '▴' : '▾'; syncKpHeight(); };
function syncKpHeight() {

  const h = window.matchMedia('(max-width: 979px)').matches ? k.getBoundingClientRect().height : 0;

/* ---------- Start ---------- */
K.prepM = s => K._prepM(s);
applyTheme(); syncAngle(); applyLogo(); applyLang(); whenMathJax();
(function start() {
  const last = HIST[0];
  const ex = last ? last.in : 'x^2-5x+6=0';
  setEditorText(ex);
  try { const r = K.run(toDisp(ex)); r.raw = ex; r.edTex = ED.embedTo(mf.latex(), ED.mxPmat); if (!ENGINE_TEX.has(r.kind) && r.kind !== 'def') r.inTex = K.decFix(r.edTex); LAST = r; showResult(r, !last); } catch (e) { }
  renderRecent();
  if (!TOUCH) mf.focus();
  mf.moveToRightEnd(); keepCursor();
  if (S.autoUpdate) checkUpdate(false);
})();
